<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proje — Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <header>
    <div class="header-inner">
      <a class="logo" href="index.html">dev.portfolio</a>
      <nav>
        <a href="index.html#projects">Projeler</a>
        <a href="index.html#about">Hakkımda</a>
        <a href="index.html#contact" class="nav-cta">İletişim</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="detail-page" id="detailPage"></div>
  </main>

  <footer>
    <div class="footer-inner">
      <a class="footer-logo" href="index.html">dev.portfolio</a>
      <p class="footer-text">Tasarlandı &amp; kodlandı — 2024</p>
    </div>
  </footer>

  <script src="projects.js"></script>
  <script>
    const params  = new URLSearchParams(window.location.search);
    const id      = parseInt(params.get('id'), 10);
    const idx     = projects.findIndex(p => p.id === id);
    const project = projects[idx];

    if (!project) {
      document.getElementById('detailPage').innerHTML = `
        <a class="back-btn" href="index.html">← Geri Dön</a>
        <p style="color:var(--muted)">Proje bulunamadı.</p>
      `;
    } else {
      document.title = `${project.title} — Portfolio`;

      const prev = idx > 0 ? projects[idx - 1] : null;
      const next = idx < projects.length - 1 ? projects[idx + 1] : null;

      const navHTML = `
        <div class="project-nav">
          ${prev
            ? `<a class="nav-card prev" href="project.html?id=${prev.id}">
                <div class="nav-dir">← Önceki</div>
                <div class="nav-name">${prev.title}</div>
                <div class="nav-cat">${prev.category}</div>
               </a>`
            : `<div></div>`}
          ${next
            ? `<a class="nav-card next" href="project.html?id=${next.id}">
                <div class="nav-dir">Sonraki →</div>
                <div class="nav-name">${next.title}</div>
                <div class="nav-cat">${next.category}</div>
               </a>`
            : `<div></div>`}
        </div>
      `;

      document.getElementById('detailPage').innerHTML = `
        <a class="back-btn" href="index.html">← Tüm Projelere</a>

        <span class="detail-category">${project.category}</span>

        <h1 class="detail-title">${project.title}</h1>

        <div class="detail-meta">
          ${project.tags.map(t => `<span class="tag">${t}</span>`).join('')}
        </div>

        <div class="detail-links-row">
          <a class="btn btn-primary" href="${project.live}" target="_blank">Canlıya Bak ↗</a>
          <a class="btn btn-ghost"   href="${project.github}" target="_blank">GitHub →</a>
        </div>

        <img class="detail-image" src="${project.image}" alt="${project.title}" />

        <p class="detail-desc">${project.longDescription}</p>

        <div class="detail-features">
          <h2>Özellikler</h2>
          <ul>
            ${project.features.map(f => `<li>${f}</li>`).join('')}
          </ul>
        </div>

        ${navHTML}
      `;
    }
  </script>
</body>
</html>
