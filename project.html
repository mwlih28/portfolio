<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proje — M&B Studio</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23a855f7'/><text x='50%25' y='55%25' text-anchor='middle' dy='.35em' font-size='12' fill='white' font-weight='bold'>M%26B</text></svg>" />
</head>
<body>

  <!-- Preloader -->
  <div class="preloader" id="preloader">
    <div class="preloader-inner">
      <div class="preloader-logo">M&B</div>
      <div class="preloader-bar"><div class="preloader-fill"></div></div>
    </div>
  </div>

  <!-- Page Transition -->
  <div class="page-transition" id="pageTransition"></div>

  <!-- Cursor Glow -->
  <div class="cursor-glow" id="cursorGlow"></div>

  <!-- Scroll progress -->
  <div class="scroll-progress" id="scrollProgress"></div>

  <div class="mesh" aria-hidden="true"></div>
  <div class="noise" aria-hidden="true"></div>

  <header>
    <nav class="nav-bar">
      <a class="logo" href="index.html">
        <div class="logo-icon">M&B</div>
        studio
      </a>
      <div class="nav-right">
        <a href="index.html#projects">Projeler</a>
        <a href="index.html#team">Ekip</a>
        <button class="theme-toggle" id="themeToggle" aria-label="Tema değiştir">
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <a href="index.html#contact" class="contact-btn">İletişim</a>
        <button class="hamburger" id="hamburger" aria-label="Menü">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>
  </header>

  <!-- Mobile Menu -->
  <nav class="mobile-menu" id="mobileMenu">
    <a href="index.html#projects" class="mobile-link">Projeler</a>
    <a href="index.html#team" class="mobile-link">Ekip</a>
    <a href="index.html#contact" class="mobile-link mobile-contact">İletişim</a>
  </nav>

  <main>
    <div class="detail" id="dp"></div>
  </main>

  <footer>
    <div class="foot-row">
      <a class="foot-logo" href="index.html"><div class="logo-icon" style="font-size:.45rem">M&B</div>studio</a>
      <span class="foot-txt">© 2024 — Melih & Berat</span>
    </div>
  </footer>

  <script src="projects.js"></script>
  <script>
  (() => {
    const isMobile = window.matchMedia('(max-width:640px)').matches;

    // ─── PRELOADER ───
    window.addEventListener('load', () => {
      setTimeout(() => document.getElementById('preloader').classList.add('done'), 400);
    });

    // ─── CURSOR GLOW (desktop only) ───
    if (!isMobile) {
      const glow = document.getElementById('cursorGlow');
      let glowX = 0, glowY = 0, curX = 0, curY = 0, glowActive = false, rafId = 0;
      function animateGlow() {
        curX += (glowX - curX) * .12;
        curY += (glowY - curY) * .12;
        glow.style.left = curX + 'px';
        glow.style.top = curY + 'px';
        if (glowActive) rafId = requestAnimationFrame(animateGlow);
      }
      document.addEventListener('mousemove', e => {
        glowX = e.clientX; glowY = e.clientY;
        if (!glowActive) { glowActive = true; glow.classList.add('active'); rafId = requestAnimationFrame(animateGlow); }
      });
      document.addEventListener('mouseleave', () => {
        glowActive = false; glow.classList.remove('active'); cancelAnimationFrame(rafId);
      });
    }

    // ─── PAGE TRANSITIONS ───
    const ptEl = document.getElementById('pageTransition');
    document.addEventListener('click', e => {
      const link = e.target.closest('a[href]');
      if (!link) return;
      const href = link.getAttribute('href');
      if (!href || href.startsWith('mailto:') || link.target === '_blank') return;
      e.preventDefault();
      ptEl.classList.add('enter');
      setTimeout(() => { window.location.href = href; }, 450);
    });

    // ─── HAMBURGER MENU ───
    const burger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');
    burger.addEventListener('click', () => {
      burger.classList.toggle('open');
      mobileMenu.classList.toggle('open');
      document.body.style.overflow = mobileMenu.classList.contains('open') ? 'hidden' : '';
    });
    document.querySelectorAll('.mobile-link').forEach(link => {
      link.addEventListener('click', () => {
        burger.classList.remove('open');
        mobileMenu.classList.remove('open');
        document.body.style.overflow = '';
      });
    });

    // ─── SCROLL PROGRESS ───
    const progressBar = document.getElementById('scrollProgress');
    let scrollTicking = false;
    window.addEventListener('scroll', () => {
      if (!scrollTicking) {
        requestAnimationFrame(() => {
          const h = document.documentElement.scrollHeight - window.innerHeight;
          progressBar.style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + '%';
          scrollTicking = false;
        });
        scrollTicking = true;
      }
    }, { passive: true });

    // ─── THEME ───
    const toggle = document.getElementById('themeToggle');
    const html = document.documentElement;
    const saved = localStorage.getItem('theme');
    if (saved) html.dataset.theme = saved;
    toggle.addEventListener('click', () => {
      const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
      html.dataset.theme = next;
      localStorage.setItem('theme', next);
    });

    // ─── PROJECT DETAIL ───
    const id  = parseInt(new URLSearchParams(location.search).get('id'), 10);
    const idx = projects.findIndex(p => p.id === id);
    const p   = projects[idx];
    const dp  = document.getElementById('dp');

    if (!p) {
      dp.innerHTML = `<a class="back" href="index.html">← Geri Dön</a><p style="color:var(--dim)">Proje bulunamadı.</p>`;
      return;
    }
    document.title = `${p.title} — M&B Studio`;

    const info = getAuthorInfo(p.author);
    const prev = idx > 0 ? projects[idx - 1] : null;
    const next = idx < projects.length - 1 ? projects[idx + 1] : null;

    const authorDots = info.colors.map(c =>
      `<span style="width:10px;height:10px;border-radius:50%;background:${c};display:inline-block;border:2px solid rgba(0,0,0,.3)"></span>`
    ).join('');

    dp.innerHTML = `
      <a class="back" href="index.html">← Tüm Projelere</a>
      <span class="d-cat">${p.category}</span>
      <h1 class="d-h1">${p.title}</h1>

      <div class="d-author-row">
        <div class="d-author">
          <div class="author-dots">${authorDots}</div>
          <span class="d-author-name">${info.label}</span>
        </div>
        <div class="d-tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      </div>

      <div class="d-links">
        <a class="btn btn-fill" href="${p.live}" target="_blank">Canlıya Bak ↗</a>
        <a class="btn btn-ring" href="${p.github}" target="_blank">GitHub →</a>
      </div>

      <img class="d-hero-img" src="${p.image}" alt="${p.title}">

      <p class="d-text">${p.longDescription}</p>

      <div class="d-feats">
        <h2>Özellikler</h2>
        <ul>${p.features.map(f => `<li>${f}</li>`).join('')}</ul>
      </div>

      <div class="pnav">
        ${prev ? `<a class="pnav-card prev" href="project.html?id=${prev.id}">
          <div class="pnav-dir">← Önceki</div>
          <div class="pnav-name">${prev.title}</div>
          <div class="pnav-cat">${prev.category}</div>
        </a>` : '<div></div>'}
        ${next ? `<a class="pnav-card next" href="project.html?id=${next.id}">
          <div class="pnav-dir">Sonraki →</div>
          <div class="pnav-name">${next.title}</div>
          <div class="pnav-cat">${next.category}</div>
        </a>` : '<div></div>'}
      </div>`;
  })();
  </script>
</body>
</html>
