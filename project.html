<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proje — Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="nav">
      <a class="logo" href="index.html">
        <div class="logo-sq"></div>dev.portfolio
      </a>
      <div class="nav-links">
        <a href="index.html#projects">Projeler</a>
        <a href="index.html#about">Hakkımda</a>
        <a href="index.html#contact" class="cta">İletişim</a>
      </div>
    </div>
  </header>

  <main>
    <div class="detail-wrap" id="dp"></div>
  </main>

  <footer>
    <div class="footer-row">
      <a class="footer-logo" href="index.html">
        <div class="logo-sq"></div>dev.portfolio
      </a>
      <p class="footer-cp">Tasarlandı &amp; kodlandı — 2024</p>
    </div>
  </footer>

  <script src="projects.js"></script>
  <script>
  (() => {
    const id  = parseInt(new URLSearchParams(location.search).get('id'), 10);
    const idx = projects.findIndex(p => p.id === id);
    const p   = projects[idx];
    const dp  = document.getElementById('dp');

    if (!p) {
      dp.innerHTML = `<a class="back-btn" href="index.html">← Geri Dön</a><p style="color:var(--t2)">Proje bulunamadı.</p>`;
      return;
    }

    document.title = `${p.title} — Portfolio`;

    const prev = idx > 0 ? projects[idx - 1] : null;
    const next = idx < projects.length - 1 ? projects[idx + 1] : null;

    dp.innerHTML = `
      <a class="back-btn" href="index.html">← Tüm Projelere</a>

      <span class="d-cat">${p.category}</span>
      <h1 class="d-title">${p.title}</h1>

      <div class="d-tags">
        ${p.tags.map(t => `<span class="ptag">${t}</span>`).join('')}
      </div>

      <div class="d-links">
        <a class="btn btn-ac" href="${p.live}" target="_blank">Canlıya Bak ↗</a>
        <a class="btn btn-ghost" href="${p.github}" target="_blank">GitHub →</a>
      </div>

      <img class="d-img" src="${p.image}" alt="${p.title}">

      <p class="d-text">${p.longDescription}</p>

      <div class="d-feats">
        <h2>Özellikler</h2>
        <ul>${p.features.map(f => `<li>${f}</li>`).join('')}</ul>
      </div>

      <div class="pnav">
        ${prev
          ? `<a class="pnav-card prev" href="project.html?id=${prev.id}">
               <div class="pnav-dir">← Önceki Proje</div>
               <div class="pnav-name">${prev.title}</div>
               <div class="pnav-cat">${prev.category}</div>
             </a>`
          : `<div></div>`}
        ${next
          ? `<a class="pnav-card next" href="project.html?id=${next.id}">
               <div class="pnav-dir">Sonraki Proje →</div>
               <div class="pnav-name">${next.title}</div>
               <div class="pnav-cat">${next.category}</div>
             </a>`
          : `<div></div>`}
      </div>`;
  })();
  </script>

</body>
</html>
